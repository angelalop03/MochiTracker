# Configuración del proyecto hospedado. Se aplica con: npx.cmd supabase config push
project_id = "ihqysdaqktkqknuvqaye"

[auth]
site_url = "https://isla-mochi.vercel.app"
additional_redirect_urls = ["https://isla-mochi.vercel.app/**", "http://localhost:5173/**"]

# Con el SMTP de Brevo (300 correos al día) se puede subir el límite por defecto de 30 por hora.
[auth.rate_limit]
email_sent = 60

# Los asuntos son neutros porque se ven en la pantalla de bloqueo.
# Editar plantillas exige un SMTP propio, configurado en el panel de Supabase con Brevo.
[auth.email.template.magic_link]
subject = "Tu acceso a Isla Mochi"
content_path = "./supabase/templates/acceso.html"

[auth.email.template.confirmation]
subject = "Tu acceso a Isla Mochi"
content_path = "./supabase/templates/acceso.html"
