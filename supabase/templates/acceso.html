<!doctype html>
<html lang="es">
  <body style="margin:0;padding:0;background:#FFF7F3">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FFF7F3">
      <tr>
        <td align="center" style="padding:24px 12px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;font-family:'Trebuchet MS',Verdana,sans-serif;color:#4A2F45;line-height:1.6">
            <tr>
              <td style="padding:0 8px 12px;font-size:18px;font-weight:bold;color:#B0406F">Isla Mochi</td>
            </tr>
            <tr>
              <td style="background:#FFFFFF;border-radius:22px;padding:24px;font-size:16px">
                <p style="margin:0 0 16px">Pulsa el botón para entrar en tu isla.</p>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 24px;border-radius:999px;background:#B0406F;color:#FFFFFF;font-weight:bold;text-decoration:none">Entrar</a>
                <p style="margin:20px 0 4px">Si usas la app instalada en el móvil, escribe este código:</p>
                <p style="margin:0;font-size:28px;font-weight:bold;letter-spacing:4px">{{ .Token }}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 8px;font-size:12px;color:#6E5068">Si no has pedido este correo, puedes ignorarlo.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
