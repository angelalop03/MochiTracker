<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF7F3" />
    <meta
      name="description"
      content="Tu ciclo como las estaciones de una pequeña isla: qué fase vives hoy y consejos para acompañarla."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Isla Mochi" />
    <title>Isla Mochi</title>
    <script>
      // Aplica el tema antes de pintar, para que no haya un destello claro en modo noche
      try {
        var tema = localStorage.getItem("isla-mochi-tema")
        var oscuro = tema === "dark" || (tema !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.dataset.theme = oscuro ? "dark" : "light"
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
